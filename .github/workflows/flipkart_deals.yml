name: Flipkart Minutes Deals Alert

on:
  schedule:
    # 10:00 AM through 1:00 AM IST, hourly (04:30-19:30 UTC).
    - cron: '30 4-19 * * *'
  repository_dispatch:
    types: [hourly_deals_scan, flipkart_scan]
  workflow_dispatch:
    inputs:
      min_discount:
        description: 'Minimum Discount % threshold'
        required: false
        default: ''
      pincode:
        description: 'Delivery Pincode'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (do not post to Telegram)'
        required: false
        default: 'false'
        type: boolean

jobs:
  scrape-and-alert:
    name: Scrape Deals & Alert Telegram
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r bot/requirements.txt

      - name: Restore Deals Cache
        uses: actions/cache/restore@v4
        with:
          path: data/posted_deals.json
          key: deals-cache-${{ github.run_id }}
          restore-keys: |
            deals-cache-

      - name: Run Flipkart Minutes Deals Scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PINCODE: ${{ github.event.client_payload.pincode || inputs.pincode || secrets.PINCODE || '' }}
          MIN_DISCOUNT: ${{ github.event.client_payload.min_discount || inputs.min_discount || secrets.MIN_DISCOUNT || '' }}
          FLIPKART_COOKIE: ${{ secrets.FLIPKART_COOKIE }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          MAX_WORKERS: '5'
        run: |
          if [ -z "$PINCODE" ] || [ -z "$MIN_DISCOUNT" ] || [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Missing Flipkart pincode, discount threshold, or Telegram setup; skipping scan."
            exit 0
          fi
          python -m bot.main

      - name: Save Deals Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/posted_deals.json
          key: deals-cache-${{ github.run_id }}
